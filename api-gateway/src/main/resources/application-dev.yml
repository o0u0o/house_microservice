# eureka配置
eureka:
  client:
    # api-gateway服务 false-不需要注册到注册中心
    register-with-eureka: false
    fetch-registry: true
    service-url:
      defaultZone: http://127.0.0.1:8666/eureka
# hytrix断路器配置
hytrix:
  command:
    default:
      execution:
        isolation:
          thread:
            # 超时时间10s
            timeoutInMilliseconds: 10000
      circuitBreaker:
        # 失败的阈值50%
        errorThresholdPercentage: 50
        # 休眠的时间10s
        sleepThresholdPercentage: 10000
  # hytrix-线程池配置
  threadpool:
    default:
      # 核心线程数
      coreSize: 5
      # 最大队列长度
      maxQueueSize: 30
      # 最大线程数
      maximumSize: 10

      queueSizeRejectionThreshold: 30

