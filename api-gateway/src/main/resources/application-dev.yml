####暴露端点给Prometheus采集 [必须] - START ####
management:
  server:
    port: 8023
  endpoints:
    web:
      exposure:
        # 暴露端口：metrics，其中就包含我们需要的JVM相关指标
        # 需要暴露的端点：[health,info,metrics]用,分隔
        include: info,metrics,prometheus
  endpoint:
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        pushgateway:
          # 启用推送 如果不需要设置为false
          enabled: false
          username: ENC(SfTvfV6BnIYOsSrHEpGZCXzKF1KL62hYDSKbDBR3+h5y63G61fhRCKthwPKcIr2x)
          password: ENC(YNye0NvTzUZVfB+l1I4a9m0ua2AG0K/+ElShxlZPfc710GAti9B7SGoTP/yOQaoP)
          # PUSHGATEWAY 地址
          baseUrl: ENC(gLE7IvLP8gNnqP8UUE0UtgGYhGIWSg/JJnew1As43IUfADqWdRpc+MOdmy/AqrPAZPpWXZwigwSY83q5LoXu4Q==)
          # 推送周期 每隔15秒上报一次
          pushRate: 15s
          # job定义名
          job : ${spring.application.name}
