spring:
  application:
    name: comment-srv
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ENC(iwgqjMdmwGW0TSBrIKmhyUNGTNj4lNbhFgEBT7IltDbxI8C2tGOY/dtP2wqrnkMMHxwsTHiQyvpMpUnKb/Giu1chKAKgdHCdPh10V7pJ9SxN0n614VbgwZNDZlEv5p0OVuEEAqi39k/3UVIkRSdR6g==)
    username: ENC(DnJLR4jkYvyDAfUXa+eZcdAWahAJA56DX8vcHExlYp3pjXsCtVqhM/vpo/Uudyh0)
    password: ENC(DnJLR4jkYvyDAfUXa+eZcdAWahAJA56DX8vcHExlYp3pjXsCtVqhM/vpo/Uudyh0)
    hikari:
      pool-name: CommentHikariPool      # 连接池名称（日志里好辨认）
      maximum-pool-size: 20             # 最大连接数（默认 10，生产建议 20）
      minimum-idle: 5                   # 最小空闲连接（默认 10）
      connection-timeout: 30000         # 获取连接超时（ms，默认 30s）
      idle-timeout: 600000              # 空闲连接最大存活时间（ms，默认 10min）
      max-lifetime: 1800000             # 连接最大生命周期（ms，默认 30min，建议比 MySQL wait_timeout 短）
      connection-test-query: SELECT 1   # 连接测试查询（MySQL 8 推荐 SELECT 1）
  data:
    # Redis配置
    redis:
      host: 127.0.0.1
      database: 1
      port: 6379
      jedis:
        pool:
          max-active: 5 #最大连接数为5


mybatis:
  config-location: classpath:/mybatis/mybatis-config.xml

eureka:
  client:
    service-url:
      # 注册地址 和eureka-server一致
      defaultZone: http://127.0.0.1:8666/eureka/
    healthcheck:
      enabled: true                                 # 将服务健康状态发送到注册中心
  instance:
    lease-renewal-interval-in-seconds: 5            # 续约心跳间隔时间 5秒
    lease-expiration-duration-in-seconds: 10        # 续约过期时间 10秒 每隔10秒检查一次

house:
  service:
    name: property-srv
user:
  service:
    name: user-srv

# 配置logbook #日志级别为info
logbook:
  write:
    level: info
  format:
    style: http

# log4j2配置
logging:
  config: classpath:log4j2.xml