mybatis:
  config-location: classpath:/mybatis/mybatis-config.xml
file:
  prefix: 127.0.0.1:8083/static/imgs

# Eureka配置
eureka:
  client:
    service-url:
      # 注册地址 和eureka-server一致
      defaultZone: http://127.0.0.1:8666/eureka/
    healthcheck:
      # 将服务健康状态发送到注册中心
      enabled: true
  instance:
    # 续约心跳间隔时间 5秒
    lease-renewal-interval-in-seconds: 5
    # 续约过期时间 10秒 每隔10秒检查一次
    lease-expiration-duration-in-seconds: 10

user:
  service:
    name: user-srv
house:
  service:
    name: property-srv
comment:
  service:
    name: comment-srv

# 配置logbook #日志级别为info
logbook:
  write:
    level: info
  format:
    style: http

# log4j2配置
logging:
  config: classpath:log4j2.xml